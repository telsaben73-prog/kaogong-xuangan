<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>考公选岗测评</title>
<style>
  :root{
    --accent:#B3392F;
    --accent-deep:#972E26;
    --accent-soft:#F8E9E7;
    --gold:#C79A4B;
    --bg:#FBF8F5;
    --card:#FFFFFF;
    --ink:#2A2421;
    --muted:#8A7F78;
    --line:#EFE7E0;
    --ok:#3E7D54;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));}

  /* ===== Hero ===== */
  .hero{
    position:relative;overflow:hidden;
    margin:0 -16px 0;
    padding:34px 22px 52px;
    color:#fff;
    border-radius:0 0 28px 28px;
    background:linear-gradient(160deg,#B3392F 0%,#C34A3D 55%,#B3392F 100%);
  }
  .hero::before{
    content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);
  }
  .hero::after{
    content:"";position:absolute;left:-30px;bottom:-70px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);
  }
  .hero .eyebrow{
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.82);margin-bottom:14px;position:relative;z-index:1;
  }
  .hero h1{
    margin:0 0 12px;font-size:30px;line-height:1.25;font-weight:800;letter-spacing:-.01em;
    position:relative;z-index:1;
  }
  .hero p{
    margin:0;font-size:14.5px;color:rgba(255,255,255,.9);max-width:40ch;position:relative;z-index:1;
  }
  .hero .seal{
    position:absolute;right:22px;bottom:40px;width:46px;height:46px;z-index:1;
    border:1.5px solid rgba(255,255,255,.5);border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.95);font-weight:700;font-size:13px;letter-spacing:.05em;
    writing-mode:vertical-rl;padding:4px 0;
  }

  /* ===== Progress ===== */
  .progress{margin:26px 4px 18px;}
  .progress .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;}
  .progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s cubic-bezier(.16,1,.3,1);}
  .progress .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
  .progress .step{font-size:13px;color:var(--muted);font-weight:600;}
  .progress .count{font-size:13px;color:var(--muted);}
  .progress .count b{color:var(--accent);font-weight:800;}

  /* ===== Question card ===== */
  .qcard{
    background:var(--card);border-radius:18px;padding:24px 20px;
    box-shadow:0 1px 2px rgba(42,36,33,.04),0 12px 32px -16px rgba(42,36,33,.12);
    animation:fadeUp .42s cubic-bezier(.16,1,.3,1);
  }
  .qcard h2{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.35;}
  .qcard .sub{margin:0 0 20px;font-size:13.5px;color:var(--muted);}
  .qcard .tag-multi{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;margin-bottom:12px;}

  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{
    position:relative;display:flex;align-items:center;gap:13px;
    border:1.5px solid var(--line);border-radius:14px;padding:14px 15px;
    cursor:pointer;transition:transform .12s ease,border-color .18s ease,background .18s ease;
    background:#fff;
  }
  .opt:active{transform:scale(.985);}
  .opt .txt{flex:1;min-width:0;}
  .opt .lb{display:block;font-size:15.5px;font-weight:600;line-height:1.4;}
  .opt .ds{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
  .opt .mark{
    flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;transition:all .18s ease;
  }
  .opt .mark svg{width:13px;height:13px;stroke:#fff;stroke-width:3;opacity:0;transform:scale(.5);transition:all .18s ease;}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt.selected .mark{background:var(--accent);border-color:var(--accent);}
  .opt.selected .mark svg{opacity:1;transform:scale(1);}

  /* ===== Nav ===== */
  .nav{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 72%,rgba(251,248,245,0));
    display:flex;gap:12px;
  }
  .nav .inner{max-width:520px;margin:0 auto;display:flex;gap:12px;width:100%;}
  .btn{
    flex:1;height:52px;border:none;border-radius:16px;font-size:16px;font-weight:700;
    cursor:pointer;transition:transform .12s ease,background .2s ease,opacity .2s ease;
    font-family:inherit;letter-spacing:.02em;
  }
  .btn:active{transform:scale(.98);}
  .btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);flex:0 0 auto;padding:0 20px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{opacity:.45;}

  /* ===== Result ===== */
  #resultView{animation:fadeUp .5s cubic-bezier(.16,1,.3,1);}
  .result-head{text-align:center;margin:26px 0 20px;}
  .result-head .big{font-size:52px;font-weight:800;line-height:1;color:var(--accent);letter-spacing:-.02em;}
  .result-head .big small{font-size:18px;font-weight:700;color:var(--muted);margin-left:2px;}
  .result-head h2{margin:12px 0 6px;font-size:21px;font-weight:800;}
  .result-head .note{font-size:13.5px;color:var(--muted);margin:0;max-width:42ch;margin-inline:auto;}
  .result-head .relax{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:600;color:var(--gold);background:rgba(199,154,75,.12);border-radius:8px;padding:5px 12px;}

  .rcard{
    background:var(--card);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;
    box-shadow:0 1px 2px rgba(42,36,33,.04),0 10px 28px -16px rgba(42,36,33,.12);
    animation:fadeUp .5s cubic-bezier(.16,1,.3,1) backwards;
  }
  .rcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .rcard .dept{font-size:16.5px;font-weight:800;line-height:1.35;color:var(--ink);}
  .rcard .num{
    flex:none;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;
    border-radius:10px;padding:5px 10px;white-space:nowrap;
  }
  .rcard .post{margin-top:6px;font-size:14px;color:var(--muted);}
  .rcard .loc{margin-top:8px;font-size:12.5px;color:var(--accent);font-weight:600;}
  .rcard .grid{margin-top:13px;padding-top:13px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;}
  .rcard .cell{font-size:12px;color:var(--muted);background:#F7F3EF;border-radius:8px;padding:5px 10px;line-height:1.5;}
  .rcard .cell b{color:var(--ink);font-weight:600;}

  .disclaimer{margin-top:22px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7;}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">2027 国考 · 选岗助手</div>
    <h1>帮她找到适合的岗位</h1>
    <p>从成都 136 个岗位里，用 5 道题筛出匹配的那几个。</p>
    <div class="seal">金榜题名</div>
  </header>

  <section id="quizView">
    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="meta">
        <span class="step" id="stepLabel"></span>
        <span class="count" id="countLabel"></span>
      </div>
    </div>
    <div class="qcard" id="qcard"></div>
  </section>

  <section id="resultView" hidden></section>
</div>

<div class="nav">
  <div class="inner">
    <button class="btn btn-ghost" id="prevBtn" style="display:none;">上一步</button>
    <button class="btn btn-primary" id="nextBtn">下一题</button>
  </div>
</div>

function locMatch(loc, pref){
  if(pref==='金牛区') return loc==='四川省成都市金牛区';
  if(pref==='主城区'){
    if(loc==='四川省成都市') return true;
    return ['金牛区','青羊区','锦江区','成华区','武侯区'].some(d=>loc.includes(d));
  }
  if(pref==='全市') return loc.includes('成都');
  return true;
}

function matchJob(job, ans){
  if(ans.major && ans.major.length && !ans.major.includes('__any__')){
    if(!job.tags.some(t=>ans.major.includes(t))) return false;
  }
  if(ans.edu){
    if(!EDU_MAP[ans.edu].includes(job.edu)) return false;
  }
  if(ans.party){
    if(job.party==='中共党员' && ans.party!=='中共党员') return false;
    if(job.party==='中共党员或共青团员' && ans.party==='群众') return false;
  }
  if(ans.exp){
    const isService = job.service!=='无限制';
    if(ans.exp==='应届' || ans.exp==='往届无经历'){
      if(job.years!=='无限制' || isService) return false;
    }else if(ans.exp==='有2年基层'){
      if(isService) return false;
      if(job.years!=='无限制' && job.years!=='二年') return false;
    }else if(ans.exp==='服务基层项目'){
      if(!isService && job.years!=='无限制' && job.years!=='二年') return false;
    }
  }
  if(ans.loc){
    if(!locMatch(job.loc, ans.loc)) return false;
  }
  return true;
}

const answers = {};
let cur = 0;
let selected = new Set();

function renderQuestion(){
  const q = QUESTIONS[cur];
  const multi = q.multi;
  selected.clear();
  if(answers[q.key] !== undefined){
    const v = answers[q.key];
    if(Array.isArray(v)) v.forEach(x=>selected.add(x));
    else if(v) selected.add(v);
  }
  const bar = document.getElementById('bar');
  const stepLabel = document.getElementById('stepLabel');
  const countLabel = document.getElementById('countLabel');
  const qcard = document.getElementById('qcard');

  bar.style.width = (cur/QUESTIONS.length*100)+'%';
  stepLabel.textContent = '第 '+(cur+1)+' / '+QUESTIONS.length+' 题';
  const prevAns = answers[q.key];
  const done = prevAns !== undefined && (!Array.isArray(prevAns) ? true : prevAns.length>0);
  countLabel.innerHTML = done ? '已选' : '待选择';

  let html = '';
  if(multi) html += '<span class="tag-multi">多选</span>';
  html += '<h2>'+q.title+'</h2><p class="sub">'+q.sub+'</p><div class="opts">';
  q.options.forEach((o,i)=>{
    const on = selected.has(o.value);
    html += '<div class="opt'+(on?' selected':'')+'" data-i="'+i+'">'
          + '<div class="txt"><span class="lb">'+o.label+'</span>'
          + (o.desc?'<span class="ds">'+o.desc+'</span>':'')
          + '</div><div class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 5" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>';
  });
  html += '</div>';
  qcard.innerHTML = html;

  qcard.querySelectorAll('.opt').forEach(el=>{
    el.addEventListener('click', ()=>{
      const o = q.options[parseInt(el.dataset.i)];
      if(multi){
        if(selected.has(o.value)) selected.delete(o.value); else selected.add(o.value);
      }else{
        selected.clear(); selected.add(o.value);
      }
      if(multi && o.value==='__any__'){
        selected.clear(); selected.add('__any__');
      }
      syncOptions(q);
      updateNav();
    });
  });

  updateNav();
}

function syncOptions(q){
  document.querySelectorAll('.opt').forEach(el=>{
    const o = q.options[parseInt(el.dataset.i)];
    const on = selected.has(o.value);
    el.classList.toggle('selected', on);
  });
  const has = selected.size>0;
  document.getElementById('countLabel').innerHTML = has ? '已选 '+(q.multi?selected.size+' 项':'') : '待选择';
}

function updateNav(){
  const q = QUESTIONS[cur];
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  prevBtn.style.display = cur===0 ? 'none' : 'flex';
  const has = selected.size>0;
  nextBtn.textContent = has ? (cur===QUESTIONS.length-1 ? '查看结果' : '下一题') : (cur===QUESTIONS.length-1 ? '直接看结果' : '跳过');
  nextBtn.disabled = false;
  if(has && q.key!=='major'){
    const arr = Array.from(selected);
    answers[q.key] = q.multi ? arr : arr[0];
  }else if(has && q.key==='major'){
    answers[q.key] = Array.from(selected);
  }else{
    // 未选：跳过该维度
    answers[q.key] = q.multi ? [] : null;
  }
}

function next(){
  if(cur < QUESTIONS.length-1){
    cur++;
    renderQuestion();
  }else{
    showResult();
  }
}

function prev(){
  if(cur>0){ cur--; renderQuestion(); }
}

function showResult(){
  document.getElementById('quizView').style.display='none';
  document.getElementById('resultView').hidden=false;
  document.getElementById('prevBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';

  let list = JOBS.filter(j=>matchJob(j, answers));
  let relax = '';

  if(list.length===0){
    const relaxedAns = Object.assign({}, answers);
    relaxedAns.loc = null;
    let l2 = JOBS.filter(j=>matchJob(j, relaxedAns));
    if(l2.length>0){ list = l2; relax = '主城区暂无完全匹配，已为你展示全市可报岗位'; }
    else{
      const relaxedAns2 = Object.assign({}, answers);
      relaxedAns2.major = [];
      const l3 = JOBS.filter(j=>matchJob(j, relaxedAns2));
      if(l3.length>0){ list = l3; relax = '已放宽专业限制，展示可报岗位'; }
    }
  }

  list.sort((a,b)=>{
    const ra = LOC_RANK[a.loc]!==undefined ? LOC_RANK[a.loc] : 2;
    const rb = LOC_RANK[b.loc]!==undefined ? LOC_RANK[b.loc] : 2;
    if(ra!==rb) return ra-rb;
    return (parseInt(b.num)||0)-(parseInt(a.num)||0);
  });

  const rv = document.getElementById('resultView');
  let html = '<div class="result-head"><div class="big">'+list.length+'<small>个岗位</small></div>';
  html += '<h2>'+ (list.length>0 ? '这是匹配的结果' : '暂未找到完全匹配的岗位') +'</h2>';
  html += '<p class="note">按她填的条件从成都岗位里筛选，报名前请以官方简章为准。</p>';
  if(relax) html += '<span class="relax">'+relax+'</span>';
  html += '</div>';

  if(list.length===0){
    html += '<div class="qcard" style="text-align:center;padding:36px 20px;"><p style="margin:0;color:var(--muted);font-size:14.5px;">条件可能偏窄，试试放宽专业或地点再测一次。</p></div>';
  }else{
    list.forEach((j,i)=>{
      html += '<div class="rcard" style="animation-delay:'+(i*0.04)+'s">'
            + '<div class="top"><div class="dept">'+j.dept+'</div><div class="num">招 '+j.num+' 人</div></div>'
            + '<div class="post">'+j.post+'</div>'
            + '<div class="loc">'+j.loc.replace('四川省成都市','成都')+'</div>'
            + '<div class="grid">'
            + '<div class="cell">专业：<b>'+j.major+'</b></div>'
            + '<div class="cell">学历：<b>'+j.edu+'</b></div>'
            + '<div class="cell">政治：<b>'+j.party+'</b></div>'
            + '<div class="cell">面试：<b>'+j.ratio+'</b></div>'
            + '</div></div>';
    });
  }

  html += '<p class="disclaimer">岗位数据来自《中央机关及其直属机构 2027 年度考试录用公务员招考简章》，结果仅供参考，报名条件请以国家公务员局官方公告为准。</p>';
  html += '<div style="text-align:center;margin:20px 0;"><button class="btn btn-ghost" id="restartBtn" style="width:100%;flex:none;">重新测评</button></div>';
  rv.innerHTML = html;

  document.getElementById('restartBtn').addEventListener('click', ()=>{
    Object.keys(answers).forEach(k=>delete answers[k]);
    cur = 0; selected.clear();
    document.getElementById('resultView').hidden=true;
    document.getElementById('quizView').style.display='';
    document.getElementById('nextBtn').style.display='';
    renderQuestion();
  });
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
renderQuestion();
</script>
</body>
</html>
